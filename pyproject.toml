[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "standard-ebooks-bridge"
version = "1.0.0"
description = "A responsible, polite HTTP bridge that turns the Standard Ebooks catalogue into a small read-only JSON API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "FDE candidate" }]
keywords = ["scraping", "api", "fastapi", "etl", "polite-client"]

dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "selectolax>=0.3.21,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<2.0",
]

[project.scripts]
se-bridge = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
  "live: tests that hit the real target site; run with --live",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
